version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: yuva_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yuva_dev}
      POSTGRES_USER: ${POSTGRES_USER:-yuva_test_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yuva_dev_secret_2026}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./supabase/migrations/apply_all.sql:/docker-entrypoint-initdb.d/01_apply_all.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yuva_test_admin -d yuva_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yuva_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-yuva_dev}
      DATABASE_USER: ${POSTGRES_USER:-yuva_test_admin}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-yuva_dev_secret_2026}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-yuva_production_master_jwt_secret_key_change_in_prod_2026}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
      DATA_MODE: REAL_DATA
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yuva_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
    driver: local
